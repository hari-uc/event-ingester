<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Ingester</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <h1>Event Ingester</h1>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="transactions">Transactions</button>
        <button class="tab-btn" data-tab="reconciliation">Reconciliation</button>
        <button class="tab-btn" data-tab="discrepancies">Discrepancies</button>
      </nav>
    </header>

    <main class="container">
      <!-- TRANSACTIONS -->
      <section id="transactions" class="panel active">
        <form class="filters" id="txn-filters">
          <label>
            <span>Merchant ID</span>
            <input name="merchant_id" placeholder="merchant_1" />
          </label>
          <label>
            <span>Payment</span>
            <select name="payment_status">
              <option value="">any</option>
              <option value="initiated">initiated</option>
              <option value="processed">processed</option>
              <option value="failed">failed</option>
            </select>
          </label>
          <label>
            <span>Settlement</span>
            <select name="settlement_status">
              <option value="">any</option>
              <option value="pending">pending</option>
              <option value="settled">settled</option>
              <option value="failed">failed</option>
            </select>
          </label>
          <label>
            <span>From</span>
            <input type="date" name="start" />
          </label>
          <label>
            <span>To</span>
            <input type="date" name="end" />
          </label>
          <label>
            <span>Sort</span>
            <select name="sort_by">
              <option value="updated_at">updated_at</option>
              <option value="initiated_at">initiated_at</option>
              <option value="amount">amount</option>
            </select>
          </label>
          <label>
            <span>Order</span>
            <select name="order">
              <option value="desc">desc</option>
              <option value="asc">asc</option>
            </select>
          </label>
          <div class="actions">
            <button type="submit" class="btn primary">Apply</button>
            <button type="reset" class="btn ghost">Reset</button>
          </div>
        </form>

        <div class="toolbar">
          <span id="txn-count" class="muted">–</span>
          <div class="spacer"></div>
          <div class="pager">
            <button id="txn-prev" class="btn small">‹ Prev</button>
            <span id="txn-page" class="muted">–</span>
            <button id="txn-next" class="btn small">Next ›</button>
          </div>
        </div>

        <div class="table-wrap">
          <table id="txn-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Merchant</th>
                <th class="right">Amount</th>
                <th>Payment</th>
                <th>Settlement</th>
                <th>Updated</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- RECONCILIATION -->
      <section id="reconciliation" class="panel">
        <form class="filters" id="recon-filters">
          <label>
            <span>Group by</span>
            <select name="group_by">
              <option value="merchant">merchant</option>
              <option value="date">date</option>
              <option value="status">status</option>
            </select>
          </label>
          <label>
            <span>From</span>
            <input type="date" name="start" />
          </label>
          <label>
            <span>To</span>
            <input type="date" name="end" />
          </label>
          <div class="actions">
            <button type="submit" class="btn primary">Apply</button>
            <button type="reset" class="btn ghost">Reset</button>
          </div>
        </form>
        <div class="table-wrap">
          <table id="recon-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- DISCREPANCIES -->
      <section id="discrepancies" class="panel">
        <form class="filters" id="disc-filters">
          <label>
            <span>Merchant ID</span>
            <input name="merchant_id" placeholder="merchant_1" />
          </label>
          <div class="actions">
            <button type="submit" class="btn primary">Apply</button>
            <button type="reset" class="btn ghost">Reset</button>
          </div>
        </form>
        <div class="toolbar">
          <span id="disc-count" class="muted">–</span>
          <div class="spacer"></div>
          <div class="pager">
            <button id="disc-prev" class="btn small">‹ Prev</button>
            <span id="disc-page" class="muted">–</span>
            <button id="disc-next" class="btn small">Next ›</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="disc-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Merchant</th>
                <th class="right">Amount</th>
                <th>Payment</th>
                <th>Settlement</th>
                <th>Reasons</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Transaction detail modal -->
    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modal-title">Transaction</h2>
          <button class="icon-btn" data-close aria-label="Close">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
